services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: claustra
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: claustra
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claustra"]
      interval: 2s
      timeout: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

